name: VirusTotal
run-name: VirusTotal ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the published release whose files are scanned (e.g. v1.0.0-rc2)'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  scan:
    name: Scan the release files
    runs-on: ubuntu-latest
    # four requests a minute on the free key: about a minute for every new file
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # a report must never turn a run red: a failed step stays red in its own line and the job still passes
      - name: Download the release files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --dir files

      - name: Scan
        continue-on-error: true
        timeout-minutes: 170
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          python3 tools/release/virustotal.py files > verdicts.md
          { printf '## VirusTotal %s\n\n' "$TAG"; cat verdicts.md; } | tee -a "$GITHUB_STEP_SUMMARY"

      # the scan takes up to hours, so the body is read only now; a body from before the markers gets the table at its end
      - name: Add the verdicts to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          grep -q '<!-- /virustotal -->' verdicts.md
          gh release view "$TAG" --json body --jq .body > body.md
          BLOCK=$(cat verdicts.md) perl -0pi -e 's/<!-- virustotal -->.*?<!-- \/virustotal -->/$ENV{BLOCK}/s or $_ .= "\n\n$ENV{BLOCK}\n"' body.md
          gh release edit "$TAG" --notes-file body.md
