name: Announce

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      notes:
        type: string
        required: false
        default: ''

jobs:
  telegram:
    name: Telegram
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Post to the project chat
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          NOTES: ${{ inputs.notes }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -eu
          # the notes of the release form keep their lines, a markdown body wraps on its own
          if [ -n "$NOTES" ]; then printf '%b\n' "$NOTES" | sed 's/$/  /'; else printf '%s\n' "$BODY"; fi > notes.md
          {
            printf '## NetworkHelm %s\n\n' "$TAG"
            if [ "$(wc -m < notes.md)" -gt 500 ]; then
              printf '<details><summary>Что нового / What is new</summary>\n\n'
              cat notes.md
              printf '\n</details>\n\n'
            else
              cat notes.md
              printf '\n'
            fi
            printf '[Скачать / Download](https://github.com/%s/releases/tag/%s) · [Демо / Demo](https://vasmarfas.github.io/networkhelm/)\n' "$GITHUB_REPOSITORY" "$TAG"
          } > message.md
          jq -n --rawfile markdown message.md '{chat_id: "@vasmarfas_chat", message_thread_id: 17, rich_message: {markdown: $markdown}}' \
            | curl -fsS --retry 3 --retry-delay 15 "https://api.telegram.org/bot$TG_BOT_TOKEN/sendRichMessage" -H 'Content-Type: application/json' -d @- > /dev/null
