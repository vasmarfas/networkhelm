name: Build Android

# Release uploads the AAB to Google Play and the APK to RuStore and the GitHub release
on:
  workflow_call:
    inputs:
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set, the release build will be unsigned and cannot be published"
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: sh tools/release/gradle.sh :app:androidApp:bundleRelease :app:androidApp:assembleRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          set -eu
          mkdir -p out mapping
          outputs=app/androidApp/build/outputs
          cp "$outputs"/bundle/release/*.aab "out/NetworkHelm-$VERSION.aab"
          cp "$outputs"/apk/release/*.apk "out/NetworkHelm-$VERSION.apk"
          if [ -f "$outputs/mapping/release/mapping.txt" ]; then
            cp "$outputs/mapping/release/mapping.txt" mapping/mapping.txt
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: android-mapping
          path: mapping/*
          if-no-files-found: ignore
