# yaml-language-server: $schema=./pack.schema.json
platform: ssh
menu: [IP, Addresses]
window:
  title: Addresses
  tabs:
    - { title: IPv4, path: ip/address }
    - { title: IPv6, path: ipv6/address }
paths:
  ip/address:
    columns: [address, network, interface, scope]
    form: address
  ipv6/address:
    columns: [address, interface, scope]
    form: address
forms:
  address:
    title: "Address <{address}>"
    tabs:
      - title: General
        fields: [address, interface, network, scope, persist]
labels:
  persist: Keep After Reboot
