# yaml-language-server: $schema=./pack.schema.json
platform: ssh
menu: [Proxy, sing-box]
window:
  title: sing-box
  tabs:
    - { title: Service, path: proxy/sing-box }
    - { title: Inbounds, path: proxy/sing-box/inbound }
    - { title: Users, path: proxy/sing-box/user }
    - { title: Outbounds, path: proxy/sing-box/outbound }
    - { title: Routing, path: proxy/sing-box/rule }
    - { title: Clients, path: proxy/sing-box/client }
paths:
  proxy/sing-box:
    form: service
    actions:
      - { title: Start, command: up }
      - { title: Stop, command: down, confirm: true }
    links:
      - { title: New Server, path: proxy/sing-box/inbound, item: true }
      - { title: Edit config.json, path: proxy/sing-box, window: proxy-sing-box-config }
  proxy/sing-box/inbound:
    columns: [tag, type, listen, port, security, network, users]
    form: inbound
    actions:
      - { title: Client Links, command: client-link, selection: true, argument: number, output: conf, added: true }
  proxy/sing-box/user:
    columns: [inbound, type, name]
    form: user
    actions:
      - { title: Client Link, command: client-link, selection: true, argument: number, output: conf }
  proxy/sing-box/outbound:
    columns: [tag, type, server, through, default]
    form: outbound
    actions:
      - { title: Make Default, command: default, selection: true, argument: number, depends: [{ default: "false" }] }
  proxy/sing-box/rule:
    columns: [domain, geosite, geoip, ip, inbound, outbound, more]
    form: rule
    actions:
      - { title: Block Ads, command: block-ads }
  proxy/sing-box/client:
    columns: [name, type, server, local-port, state, autostart]
    form: client
    actions:
      - { title: Start, command: up, selection: true }
      - { title: Stop, command: down, selection: true, confirm: true }
forms:
  service:
    title: sing-box
    tabs:
      - title: General
        fields: [state, version, inbounds, "-", autostart]
      - title: Status
        readonly: true
        fields: [config]
  inbound:
    title: "Inbound <{tag}>"
    tabs:
      - title: General
        fields: [scheme, tag, port, listen, server-name, user, path, obfs, "-", method, password, obfs-password, up-mbps, down-mbps, "-", type, users]
      - title: Certificate
        fields: [certificate, certificate-file, key-file, email]
      - title: Transport
        fields: [network, transport-path, transport-host, service-name]
      - title: Security
        fields: [security, server-names, alpn, certificate-path, key-path, dest, short-ids, private-key]
  user:
    title: "User <{name}>"
    tabs:
      - title: General
        fields: [inbound, type, name, secret, flow]
  outbound:
    title: "Outbound <{tag}>"
    tabs:
      - title: General
        fields: [kind, tag, link, through, "-", type, server, default]
  rule:
    title: Rule
    tabs:
      - title: General
        fields: [domain, geosite, geoip, ip, inbound, "-", outbound, more]
  client:
    title: "Client <{name}>"
    tabs:
      - title: General
        fields: [name, link, local-port, "-", autostart]
      - title: Status
        readonly: true
        fields: [type, server, state, config]
labels:
  secret: UUID or Password
  autostart: Start at Boot
  user: First User
  link: Link of the Server
  local-port: Local SOCKS and HTTP Port
  obfs: Salamander Obfuscation
  path: WebSocket Path
  email: ACME Email
  obfs-password: Salamander Password
  up-mbps: Upload
  down-mbps: Download
  transport-path: Path
  transport-host: Host
  server-names: Server Name
  alpn: ALPN
  certificate-path: Certificate File
  key-path: Key File
  dest: Handshake Server
  short-ids: Short IDs
  through: Dial Through
  geoip: GeoIP
  ip: IP
  more: Other Conditions
