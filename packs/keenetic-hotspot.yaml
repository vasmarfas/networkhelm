# yaml-language-server: $schema=./pack.schema.json
platform: keenetic
menu: [My Networks, Client Lists]
window:
  title: Client Lists
  tabs:
    - { title: Clients, path: clients }
paths:
  clients:
    columns: [name, ip, mac, segment, connection, online, uptime, rxbytes, txbytes, access, static-ip]
    bytes: [rxbytes, txbytes]
    quick: segment
    sort: name
    form: client
forms:
  client:
    title: "Client <{name}>"
    tabs:
      - title: General
        fields: [name, mac, access, static-ip]
      - title: Status
        readonly: true
        fields: [ip, hostname, segment, connection, online, uptime, rxbytes, txbytes, expires, registered, policy, priority]
labels:
  ip: IP Address
  mac: MAC Address
  hostname: Host Name
  connection: Connected Via
  rxbytes: Rx
  txbytes: Tx
  access: Internet Access
  static-ip: Permanent IP
  expires: Lease Expires
  priority: Traffic Priority
