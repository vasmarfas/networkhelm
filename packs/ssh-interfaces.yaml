# yaml-language-server: $schema=./pack.schema.json
platform: ssh
menu: [Interfaces]
window:
  title: Interfaces
  tabs:
    - { title: Interface, path: interface }
    - { title: Virtual, path: interface/virtual }
paths:
  interface:
    columns: [name, type, mtu, mac-address, master, tx-bits-per-second, rx-bits-per-second, tx-packets-per-second, rx-packets-per-second]
    readonly: [tx-bits-per-second, rx-bits-per-second, tx-packets-per-second, rx-packets-per-second]
    category: type
    monitor: { command: interface/monitor-traffic, argument: interface }
    form: interface
  interface/virtual:
    columns: [name, type, parent, vlan-id, mtu, mac-address, running]
    form: virtual
forms:
  interface:
    title: Interface
    tabs:
      - title: General
        fields: [name, type, mtu, mac-address, master, parent, comment, persist]
      - title: Traffic
        readonly: true
        fields: [tx-bits-per-second, rx-bits-per-second, tx-packets-per-second, rx-packets-per-second]
        monitor: { command: interface/monitor-traffic, argument: interface }
        chart: true
      - title: Statistics
        readonly: true
        fields: [tx-byte, rx-byte, tx-packet, rx-packet, tx-drop, rx-drop, tx-error, rx-error]
  virtual:
    title: "Interface <{name}>"
    tabs:
      - title: General
        fields: [type, name, parent, vlan-id, persist]
labels:
  mtu: MTU
  vlan-id: VLAN ID
  persist: Keep After Reboot
