# yaml-language-server: $schema=./pack.schema.json
platform: ssh
menu: [System, Processes]
window:
  title: Processes
  tabs:
    - { title: Processes, path: system/process }
paths:
  system/process:
    columns: [pid, user, cpu, memory, vsz, stat, command]
    bytes: [memory, vsz]
    actions:
      - { title: Hang Up, command: hang-up, selection: true }
      - { title: Terminate, command: terminate, selection: true }
      - { title: Kill, command: kill, selection: true, confirm: true }
labels:
  pid: PID
  cpu: CPU
  vsz: VSZ
  stat: State
