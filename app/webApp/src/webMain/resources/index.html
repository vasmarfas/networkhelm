<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkHelm</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation" style="position: absolute; left: calc(50% - 20px); top: calc(50% - 20px)">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script type="application/javascript">
        // uhttpd of OpenWrt sends .wasm as application/octet-stream, which instantiateStreaming refuses
        const streaming = WebAssembly.instantiateStreaming;
        WebAssembly.instantiateStreaming = async (source, imports, options) => {
            const response = await source;
            if ((response.headers.get("Content-Type") || "").startsWith("application/wasm")) return streaming.call(WebAssembly, response, imports, options);
            return WebAssembly.instantiate(await response.arrayBuffer(), imports, options);
        };
    </script>
    <script type="application/javascript">
        // sign-ins to the clouds come back here, and the page passes their answers on without starting the app: the window of a sign-in
        // of the page hands the address to the page that opened it; the state of a sign-in of the app on iOS names the scheme of the app;
        // the app of a desktop or Android signing in to CloudKit gets the web token on its loopback address, whose port the page keeps
        // for ten minutes
        (() => {
            const query = new URLSearchParams(location.search);
            const answered = /[?&](state|ckWebAuthToken|ckSession)=/.test(location.search);
            const relay = (localStorage.getItem('networkhelm-relay') || '').split(' ');
            if (answered && localStorage.getItem('networkhelm-sign-in') === 'waiting') {
                localStorage.setItem('networkhelm-sign-in', location.href);
                window.close();
                document.body.textContent = navigator.language.startsWith('ru') ? 'NetworkHelm: вход выполнен, окно можно закрыть.' : 'NetworkHelm: you are signed in, this window can be closed.';
            } else if (/^networkhelm\./.test(query.get('state') || '')) {
                location.replace('networkhelm://signin' + location.search);
            } else if (/^\d+$/.test(query.get('relay') || '') && /^https:\/\/idmsa\.apple\.com\//.test(query.get('to') || '')) {
                localStorage.setItem('networkhelm-relay', query.get('relay') + ' ' + Date.now());
                location.replace(query.get('to'));
            } else if (answered && relay.length === 2 && Date.now() - Number(relay[1]) < 600000) {
                localStorage.removeItem('networkhelm-relay');
                location.replace('http://127.0.0.1:' + relay[0] + '/' + location.search);
            } else {
                document.body.appendChild(Object.assign(document.createElement('script'), { type: 'application/javascript', src: 'webApp.js' }));
            }
        })();
    </script>
</body>
</html>
